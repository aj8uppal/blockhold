<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17222f" />
  <style>
    /* the boot screen only; the real stylesheet arrives with the bundle */
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0d1420;z-index:50;font-family:system-ui,-apple-system,sans-serif}
    #loading p{margin:0;color:#e0b24a;font-size:1.05rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
    .loading-mark{display:flex;gap:6px}
    .loading-mark span{width:16px;height:16px;background:#2e4358;border-radius:2px;animation:lb 1.1s ease-in-out infinite}
    .loading-mark span:nth-child(2){animation-delay:.14s}
    .loading-mark span:nth-child(3){animation-delay:.28s}
    .loading-bar{width:180px;height:3px;background:#1c2a3a;border-radius:2px;overflow:hidden}
    .loading-bar i{display:block;height:100%;width:40%;background:#e0b24a;border-radius:2px;animation:lp 1.4s ease-in-out infinite}
    @keyframes lb{0%,100%{transform:translateY(0);background:#2e4358}50%{transform:translateY(-7px);background:#e0b24a}}
    @keyframes lp{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    @media (prefers-reduced-motion:reduce){.loading-mark span,.loading-bar i{animation:none}.loading-bar i{width:100%}}
  </style>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Blockhold" />
  <meta name="description" content="Blockhold — a 3D voxel tower defense for the browser. Hold the line, block by block." />
  <title>Blockhold — a voxel tower defense</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" type="image/png" href="./favicon-64.png" />
  <meta property="og:title" content="Blockhold — a voxel tower defense" />
  <meta property="og:description" content="Hold the line, block by block. Ten maps, capstone towers, a daily challenge and endless mode — free in your browser." />
  <meta property="og:image" content="https://aj8uppal.github.io/blockhold/og-image.jpg" />
  <meta property="og:url" content="https://aj8uppal.github.io/blockhold/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <!--
    Nothing at all was painted until the bundle had downloaded, parsed and built
    the menu - several seconds of an unexplained dark rectangle on a phone over
    mobile data, which is exactly the window in which someone who followed a
    link decides whether this is a real thing. Inline, so it costs no request
    and appears on the first paint; removed by main.ts once the menu exists.
  -->
  <div id="loading">
    <div class="loading-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p>Blockhold</p>
    <div class="loading-bar"><i></i></div>
  </div>
  <canvas id="game" aria-label="Blockhold battlefield. Towers are built and upgraded through the on-screen controls." role="img"></canvas>
  <div id="hud"></div>
  <div id="screens"></div>
  <div id="rotate-overlay">
    <div class="rotate-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#cfe0f0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="64" height="64"><rect x="7" y="3.4" width="10" height="17.2" rx="2.4"/><circle cx="12" cy="17.6" r="1" fill="#cfe0f0" stroke="none"/><path d="M20.8 9.4a9.3 9.3 0 0 0-3.4-4.6M3.2 14.6a9.3 9.3 0 0 0 3.4 4.6"/><path fill="#cfe0f0" stroke="none" d="m21.9 6.5-.6 4-3.4-2.2Z"/><path fill="#cfe0f0" stroke="none" d="m2.1 17.5.6-4 3.4 2.2Z"/></svg></div>
    <p><b>Blockhold plays in landscape.</b><br>Rotate your device to defend the realm.</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
