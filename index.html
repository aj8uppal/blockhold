  <style>
    /* the boot screen only; the real stylesheet arrives with the bundle */
    html,body{margin:0;background:#17130f}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#17130f radial-gradient(circle at 50% 46%,rgba(242,177,52,.12),transparent 60%);z-index:50}
    #loading .loading-mark{width:min(300px,62vw);height:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
    .loading-blocks{display:flex;gap:4px}
    .loading-blocks i{width:12px;height:12px;background:#2e2720;animation:lb 1.2s steps(1) infinite}
    .loading-blocks i:nth-child(2){animation-delay:.15s}.loading-blocks i:nth-child(3){animation-delay:.3s}.loading-blocks i:nth-child(4){animation-delay:.45s}
    .loading-blocks i:nth-child(5){animation-delay:.6s}.loading-blocks i:nth-child(6){animation-delay:.75s}
    @keyframes lb{0%,40%{background:#f2b134;box-shadow:inset 0 -3px 0 #c9850f}50%,100%{background:#2e2720;box-shadow:none}}
    @media (prefers-reduced-motion:reduce){.loading-blocks i{animation:none;background:#463d32}}
  </style>
