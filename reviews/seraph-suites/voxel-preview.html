<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seraph suites · In-game voxel preview</title><style>
@font-face{font-family:Nunito;src:url('/src/fonts/nunito-400-latin.woff2')}*{box-sizing:border-box}body{margin:0;background:#241d16;color:#f4e8cf;font:15px Nunito,system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid #806442}h1{font-size:20px;margin:0}h1 span{display:block;font-size:12px;color:#beac90;font-weight:400}nav{display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#33271d;border:1px solid #806442;border-radius:9px;min-height:44px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#e8b23c;color:#261b10;border-color:#e8b23c}button:focus-visible,select:focus-visible{outline:3px solid #7fd4ff;outline-offset:2px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:#2a2118}.tools label{display:flex;align-items:center;gap:8px}.tools p{font-size:12px;color:#c7b69a;margin:0 0 0 auto}iframe{border:0;flex:1;width:100%;min-height:0;background:#c9dfe8}#status{position:fixed;bottom:14px;left:16px;padding:9px 14px;border-radius:9px;background:#211a15de;font-size:13px;pointer-events:none}a{color:#ffd25f}button:disabled,select:disabled{opacity:.45;cursor:wait}@media(max-width:700px){header{gap:10px;padding:10px}h1{font-size:17px}.tools{padding:8px 10px}.tools p{display:none}nav{gap:4px}button,select{font-size:13px;padding:8px}.tools label{font-size:12px;gap:4px}#status{font-size:11px;max-width:85%;bottom:8px}}
</style></head><body>
<header><h1>Seraph voxel study<span>Actual game renderer · Revised angular silhouettes · Local prototypes</span></h1><nav aria-label="Art direction"><button data-suite="stone" aria-pressed="false">Sacred Stone</button><button data-suite="machine" aria-pressed="false">Celestial Machines</button><button data-suite="crystal" aria-pressed="false">Crystal Wings</button><button data-suite="current" aria-pressed="true">Selected combination</button></nav></header>
<div class="tools"><label>Building <select id="form"><option value="0">T1 · Seraph Idol</option><option value="1">T2 · Seraph Ascendant</option><option value="2">T3 · Seraph Sovereign</option><option value="3">T4 · Solar Seraph</option><option value="4">T5 · The Dawnbringer</option><option value="5">T6 · Helios Engine</option><option value="6">T4 · Void Seraph</option><option value="7">T5 · The Eventide</option><option value="8" selected>T6 · Event Horizon</option></select></label><button id="context" aria-pressed="true">Gameplay zoom</button><button id="close" aria-pressed="false">Close-up</button><p>Same lighting, materials, shadows and tier scale as Blockhold.</p></div>
<iframe title="Blockhold battlefield with voxel Seraph prototype" src="/" id="game-frame"></iframe><div id="status" role="status">Preparing battlefield…</div>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),controls=[...document.querySelectorAll('button,select')];let api,suite='current';controls.forEach(c=>c.disabled=true);frame.addEventListener('load',()=>{const script=frame.contentDocument.createElement('script');script.type='module';script.src='/reviews/seraph-suites/voxel-runtime.ts';frame.contentDocument.body.append(script)});window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='seraph-preview-ready')return;api=frame.contentWindow.seraphPreview;controls.forEach(c=>c.disabled=false);status.textContent='Event Horizon · preview geometry, not deployed';update();window.previewReady=true});async function update(){const info=await api.show(suite,Number(document.querySelector('#form').value));document.querySelectorAll('[data-suite]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.suite===suite)));status.textContent=info.form.name+' · '+(suite==='current'?'selected game model · local build':'preview geometry, not deployed')}document.querySelectorAll('[data-suite]').forEach(b=>b.onclick=()=>{suite=b.dataset.suite;update()});document.querySelector('#form').onchange=update;for(const mode of ['context','close'])document.querySelector('#'+mode).onclick=()=>{api.frame(mode);document.querySelector('#context').setAttribute('aria-pressed',String(mode==='context'));document.querySelector('#close').setAttribute('aria-pressed',String(mode==='close'))};
</script></body></html>
