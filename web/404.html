<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3ecdd" />
  <meta name="robots" content="noindex" />
  <title>Not found · Blockhold</title>
  <link rel="icon" type="image/png" href="/favicon-64.png" />
  <style>
    :root { --bone: #f3ecdd; --line: #dccfb4; --ink: #17130f; --ink-2: #463d32; --gold: #c9850f; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bone); color: var(--ink); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 420px; padding: 32px 16px; text-align: center; }
    img { width: 72px; height: 72px; image-rendering: pixelated; }
    h1 { margin: 12px 0 6px; font: 900 32px/1.1 'Arial Black', Impact, sans-serif; }
    p { margin: 0 0 24px; color: var(--ink-2); }
    a { display: inline-block; padding: 10px 18px; font-weight: 750; color: var(--ink); text-decoration: none; background: #f2b134; box-shadow: inset 0 -3px 0 var(--gold); }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="72" height="72" />
    <h1>Nothing here</h1>
    <p>This page isn't part of Blockhold. The game is one tap away.</p>
    <a href="/">Play Blockhold</a>
  </main>
</body>
</html>
