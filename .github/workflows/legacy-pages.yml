name: Old address

# aj8uppal.github.io/blockhold was the game's first home. GitHub Pages now
# serves only web/legacy/ there: one page, as both index.html and 404.html,
# that forwards every old link and the player's saved progress to
# blockhold.app. Run by hand, and only when that page changes.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # GitHub serves 404.html for any path the site does not have, so
      # /blockhold/privacy.html and every other old path forward as well
      - run: |
          mkdir -p _site
          cp web/legacy/index.html _site/index.html
          cp web/legacy/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
