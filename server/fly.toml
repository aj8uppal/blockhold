# Blockhold cloud saves. One small machine and a volume: the whole dataset is
# a few KB of JSON per player.
app = "blockhold-sync"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/blockhold.db"
  ALLOWED_ORIGINS = "https://aj8uppal.github.io,http://localhost:5173,http://localhost:4173"
  # STATS_TOKEN is deliberately not here. It is a credential, so it belongs in
  # `fly secrets set`, not in a file in the repository. With it unset,
  # GET /v1/stats answers 404 and the dashboard simply does not exist.

[[mounts]]
  source = "blockhold_data"
  destination = "/data"
  # Fly snapshots the volume daily on its own; this is how long it keeps them.
  # Fourteen days is chosen to outlast a quiet fortnight: the failure this
  # guards against is a corruption nobody notices until they next look, and a
  # five-day default would already have rolled past the last good copy.
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # SQLite on a single volume: never run two writers against one file
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
